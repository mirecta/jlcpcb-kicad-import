[package]
name = "jlcpcb-kicad"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "jlcpcb-kicad"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", features = ["glow"] }
egui = "0.31"
egui_extras = { version = "0.31", features = ["image"] }
glam = "0.29"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
resvg = "0.44"
tiny-skia = "0.11"
usvg = "0.44"
rfd = "0.15"
dirs = "6"
anyhow = "1"
arboard = "3"
image = { version = "0.25", features = ["png"] }
truck-stepio = "0.3"
truck-meshalgo = "0.4"
libc = "0.2"

[features]
default = []
opencascade = []

[build-dependencies]
# No dependencies needed - build.rs uses system tools

[profile.release]
opt-level = 3
lto = true
strip = true
